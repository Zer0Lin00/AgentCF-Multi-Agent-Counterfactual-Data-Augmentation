dataset: sst2
id_dataset: sst2
ood_dataset: imdb
model_name: distilbert-base-uncased
max_length: 128
batch_size: 16
learning_rate: 2e-5
epochs: 2
seed: 42
task_type: sentiment
train_samples: 1000
eval_samples: 0
output_root: outputs

augmentation:
  method: agentcf
  ratio: 1.0
  standard_method: synonym
  num_candidates: 3
  keep_top_k: 1
  max_retry_rounds: 2

thresholds:
  label_score: 0.80
  semantic_score: 0.80
  minimality_score: 0.70
  final_score: 0.82
  general_sentiment_score: 0.70
  domain_invariant_score: 0.70
  consistency_score: 0.50
  style_robustness_score: 0.45
  filtering_mode: dynamic_percentile
  percentile_keep: 0.30

weights:
  label_score: 0.30
  semantic_score: 0.35
  minimality_score: 0.20
  consistency_score: 0.15
  difficulty_score: 0.00

runtime:
  concurrency: 100
  rate_limit_qps: 100
  checkpoint_every_n_samples: 100
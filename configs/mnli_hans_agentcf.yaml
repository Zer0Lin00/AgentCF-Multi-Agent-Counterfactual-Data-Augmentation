extends: default.yaml
dataset: mnli
id_dataset: mnli
ood_dataset: hans
task_type: nli
model_name: distilbert-base-uncased
max_length: 256
batch_size: 16
learning_rate: 2e-5
epochs: 2
train_samples: 1000
eval_samples: 0
output_root: outputs/ood_mnli_hans_agentcf_v1
augmentation:
  method: agentcf
  ratio: 1.0
  standard_method: synonym
  num_candidates: 5
  keep_top_k: 1
  max_retry_rounds: 3
thresholds:
  label_score: 0.60
  semantic_score: 0.55
  minimality_score: 0.55
  final_score: 0.60
  general_sentiment_score: 0.60
  domain_invariant_score: 0.60
  consistency_score: 0.50
  style_robustness_score: 0.45
  filtering_mode: dynamic_percentile
  percentile_keep: 0.30
verification:
  ood_mode: false
  use_wasserstein: false
ood_mode: true
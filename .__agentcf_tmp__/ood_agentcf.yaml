extends: agentcf.yaml
ood_mode: true
output_root: outputs/ood_agentcf_v1
methods:
  - No Augmentation
  - Standard Augmentation
  - AgentCF (Ours)
augmentation:
  ratio: 0.45
  num_candidates: 5
  keep_top_k: 1
  max_retry_rounds: 3
thresholds:
  label_score: 0.70
  general_sentiment_score: 0.62
  domain_invariant_score: 0.62
  semantic_score: 0.76
  minimality_score: 0.62
  final_score: 0.66
  selector_ood_score: 0.60
  percentile_keep: 0.35
weights:
  label_score: 0.22
  general_sentiment_score: 0.20
  domain_invariant_score: 0.18
  semantic_score: 0.18
  minimality_score: 0.08
  consistency_score: 0.04
  style_robustness_score: 0.10
verification:
  ood_mode: true
  sst2_label_model_name: distilbert-base-uncased-finetuned-sst-2-english
  general_sentiment_model_name: cardiffnlp/twitter-roberta-base-sentiment-latest
training_regularization:
  agentcf_sample_weight: 0.55
  weight_decay: 0.02
